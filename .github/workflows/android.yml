name: Offline Hybrid App Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    # Here is the magic: We download the 1.1GB model straight into the Android Assets folder seamlessly during the build!
    - name: Download Qwen Hybrid Model into Assets
      run: |
        mkdir -p app/src/main/assets
        curl -L -o app/src/main/assets/qwen2.5-1.5b-instruct-q4_k_m.gguf "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build Debug APK
      run: gradle assembleDebug
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: offline-hybrid-app
        path: app/build/outputs/apk/debug/app-debug.apk
