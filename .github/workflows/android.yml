name: Offline Hybrid App Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Install NDK 25.1.8937393
      run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"

    - name: Install ccache
      run: sudo apt-get install -y ccache && ccache --max-size=2G

    - name: Cache ccache objects
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-android-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**') }}
        restore-keys: ccache-android-${{ runner.os }}-

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'
        validate-wrappers: false

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace
      
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: offline-hybrid-app
        path: app/build/outputs/apk/debug/app-debug.apk
